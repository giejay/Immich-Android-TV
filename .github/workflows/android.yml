name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle (caches the wrapper distribution and dependencies)
      uses: gradle/actions/setup-gradle@v4

    - name: Download Gradle distribution (retry on GitHub hiccups)
      run: |
        chmod +x gradlew
        for attempt in 1 2 3 4; do
          ./gradlew --version && exit 0
          echo "Gradle download failed (attempt $attempt), retrying in 30s"
          sleep 30
        done
        exit 1

    - name: Extra strings file
      env:
        STRINGS_OTHER_BASE64: ${{secrets.STRINGS_OTHER}}
      run: |
         if [ -n "$STRINGS_OTHER_BASE64" ]; then
           echo "$STRINGS_OTHER_BASE64" | base64 --decode > ./app/src/main/res/values/strings_other.xml
         fi

    - name: Check keystore availability
      id: keystore_check
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
        fi

    - name: Decode Keystore
      if: steps.keystore_check.outputs.available == 'true'
      env:
        KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

    - name: Build signed APK
      if: steps.keystore_check.outputs.available == 'true'
      env:
        RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        for attempt in 1 2 3; do
          ./gradlew assembleRelease && exit 0
          echo "Build failed (attempt $attempt), retrying in 60s (dependency downloads can hit GitHub 504s)"
          sleep 60
        done
        exit 1

    - name: Build and Test
      if: steps.keystore_check.outputs.available != 'true'
      run: |
        for attempt in 1 2 3; do
          ./gradlew assembleDebug test && exit 0
          echo "Build failed (attempt $attempt), retrying in 60s (dependency downloads can hit GitHub 504s)"
          sleep 60
        done
        exit 1

    - name: Upload Artifacts
      if: steps.keystore_check.outputs.available == 'true'
      uses: actions/upload-artifact@v4
      with:
          name: immich-tv-beta.apk
          path: ./app/build/outputs/apk/release/*.apk